name: quality

# Runs the full PR quality suite — lint, typecheck, test, and convention
# regression-greps. Each job runs in parallel so one failure doesn't
# block the others; all four must be green for the PR to be mergeable
# (gate via branch protection).
#
# Husky pre-push only blocks direct pushes to main; it doesn't run
# lint/typecheck/test. This workflow is the actual quality gate.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when a branch gets a new push.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # turbo --filter='...[origin/main]' needs the full history so
          # the action can resolve origin/main. Default shallow clone
          # (fetch-depth: 1) breaks the filter. mutav-app is small enough
          # that the extra fetch cost is negligible.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        # Per-app gating via Turborepo filter: lint only changed apps +
        # their dependents (`...[origin/main]`). Root-level scripts in
        # package.json stay unfiltered so local devs get whole-monorepo
        # behavior; the filter only applies in CI.
        run: bunx turbo run lint --filter='...[origin/main]'

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        # Convex generated types are committed; typecheck reads them directly.
        # If they drift from schema.ts, tsc surfaces the inconsistency here.
        run: bunx turbo run typecheck --filter='...[origin/main]'

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bunx turbo run test --filter='...[origin/main]'

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        # ubuntu-latest images already include rg, but pin the install in
        # case the runner image changes upstream.
        run: which rg || sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        # The other jobs install for turbo; this one needs it for vitest.
        run: bun install --frozen-lockfile
      - name: Regression greps
        # Root-level convention check (not a per-app turbo task) — always
        # runs on every PR regardless of which app changed.
        run: bash scripts/regression-greps.sh
      - name: Shell contract
        # Surveys all four apps, so it must NOT sit behind the
        # `...[origin/main]` turbo filter the test job uses.
        run: bun run test:structure
